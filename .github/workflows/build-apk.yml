name: Build APK

on:
  push:
    branches: ["main", "claude/game-creation-pf0j2p"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.8
          cache: true

      - name: Dépendances
        working-directory: app
        run: flutter pub get

      - name: Tests
        working-directory: app
        run: flutter test

      - name: Build APK (par architecture)
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Publier la release « apk-latest »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Dernier APK (MESSAGES)
          body: |
            APK compilé automatiquement depuis le dernier push.
            - `app-arm64-v8a-release.apk` : téléphones Android récents (à installer dans la plupart des cas)
            - `app-armeabi-v7a-release.apk` : vieux téléphones 32 bits (sans IA locale)

            IA locale : voir le README (modèle Gemma `.task` à installer depuis l'écran verrouillé → engrenage).
          prerelease: true
          files: |
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
